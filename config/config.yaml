inputs: config/inputs.tsv
output_dir: results
work_dir: work
log_dir: logs

threads:
  graph: 8
  deconstruct: 8
  vcf: 4

resources:
  validation: 1024
  graph: 32768
  deconstruct: 32768
  vcf: 8192
  snpeff: 8192
  annotsv: 8192

# Emit nested snarls as separate records and simplify reference path names to contigs.
deconstruct:
  all_snarls: true
  contig_only_ref: true
  keep_conflicted: false

# Must match each manifest reference FASTA assembly and contig naming.
snpeff:
  genome: GRCh38.mane.1.0.ensembl
  data_dir: resources/snpeff
  download_database: true

# Download the AnnotSV annotation bundle separately and point to it here.
annotsv:
  genome_build: GRCh38
  annotations_dir: resources/AnnotSV_annotations
  min_size: 50
